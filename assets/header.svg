  <style>
    .tw { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }
    .fl { animation: fl 4.2s ease-in-out infinite; }
    .dot { animation: dot 3.2s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .45; transform: scale(.72) rotate(14deg); } }
    @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .steam { animation: steam 2.4s ease-in-out infinite; opacity: 0; }
    .cat { transform-box: fill-box; transform-origin: 50% 100%; animation: cat 3.2s ease-in-out infinite; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 50% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes cat { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 1.035); } }
    @keyframes dot { 0%,100% { opacity: .9; } 50% { opacity: .2; } }
    .title { font: 700 52px 'Nunito','Quicksand','Segoe UI Rounded','Trebuchet MS','Segoe UI',sans-serif; fill: #9a6fd0; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; paint-order: stroke; }
    .sub { font: 600 22px 'Nunito','Quicksand','Segoe UI Rounded','Trebuchet MS','Segoe UI',sans-serif; fill: #b08ad6; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; paint-order: stroke; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

