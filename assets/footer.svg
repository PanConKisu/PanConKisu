<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ecff"/>
      <stop offset="0.5" stop-color="#e8dcff"/>
      <stop offset="1" stop-color="#ffd9ec"/>
    </linearGradient>
    <path id="star" d="M0,-10 L2.65,-3.64 L9.51,-3.09 L4.28,1.39 L5.88,8.09 L0,4.5 L-5.88,8.09 L-4.28,1.39 L-9.51,-3.09 L-2.65,-3.64 Z" stroke-width="2.6" stroke-linejoin="round"/>
    <path id="sparkle" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10 Z"/>
  </defs>
  <style>
    .tw { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .45; transform: scale(.72) rotate(-14deg); } }
    .t { font: 700 30px 'Nunito','Quicksand','Segoe UI Rounded','Trebuchet MS','Segoe UI',sans-serif; fill: #9a6fd0; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; paint-order: stroke; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1000" height="120" rx="24" fill="url(#bg)"/>
  <g transform="translate(70 40) scale(1.4)"><use class="tw" href="#star" fill="#ff9ecf" stroke="#ff9ecf"/></g>
  <g transform="translate(150 82) scale(.9)"><use class="tw" href="#sparkle" fill="#ffd966" style="animation-delay:.7s"/></g>
  <g transform="translate(230 34) scale(.7)"><use class="tw" href="#sparkle" fill="#ffffff" style="animation-delay:1.3s"/></g>
  <g transform="translate(930 80) scale(1.4)"><use class="tw" href="#star" fill="#b79cff" stroke="#b79cff" style="animation-delay:.4s"/></g>
  <g transform="translate(850 38) scale(.9)"><use class="tw" href="#sparkle" fill="#86ddb8" style="animation-delay:1s"/></g>
  <g transform="translate(818 94) scale(.7)"><use class="tw" href="#star" fill="#8fcbff" stroke="#8fcbff" style="animation-delay:1.6s"/></g>
  <text class="t" x="500" y="71" text-anchor="middle">thanks for stopping by, come back soon ✦</text>
</svg>
